name: Integracion Continua - Sistema de Inventario

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verificar sintaxis del codigo fuente
      run: |
        python -m py_compile src/producto.py

    - name: Ejecutar construccion y pruebas automatizadas
      run: |
        python -m unittest discover tests
